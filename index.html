<style>
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

  :root{

    border-radius:16px;border-top-left-radius:4px}
  /* speech tail */
  .opt .bubble::before{content:"";position:absolute;left:-7px;top:12px;width:0;height:0;
    border:7px solid transparent;border-right-color:var(--surface);border-left:0;
    filter:drop-shadow(-1.5px 0 0 var(--border));transition:.18s}
  .opt:hover .bubble{border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px)}
  .opt:hover .bubble::before{border-right-color:var(--surface-2);filter:drop-shadow(-1.5px 0 0 var(--border-strong))}

  /* ---- blind answers (nickname stays hidden) ---- */
  .opt__nick.is-hidden{color:var(--text-faint);letter-spacing:.08em}
  .opt__nick.is-hidden::before{background:#eee}
  .opt:hover .opt__nick.is-hidden{color:var(--text-faint)}
  .achat.is-locked{pointer-events:none}
  .achat.is-locked .opt:not(.is-picked) > *{opacity:.4;transition:opacity .3s}
  .opt.is-picked .bubble{border-color:var(--border-strong);background:var(--surface-2)}
  .opt.is-picked .bubble::before{border-right-color:var(--surface-2);filter:drop-shadow(-1.5px 0 0 var(--border-strong))}


  /* ---- stated ideal / doubt ---- */

  .screen.qscreen{padding-top:14px}
  .qscreen .progress{margin:4px 0 6px}
  .qscreen .qtitle{margin:4px 6px 12px}
  .qscreen .qask{margin-bottom:12px}
  .screen.result{padding-top:14px}
  .result{padding-bottom:96px}
  .cardimg{width:86%;margin:0 auto 12px;border-radius:22px;overflow:hidden;aspect-ratio:9/16;

  .cardimg img{display:block;width:100%;height:100%}
  .cardimg img:not([src]){visibility:hidden}

  /* ---- share card: one screenshot = gap + type + brand ---- */
  .scard{background:var(--bg-2);border:1.5px solid var(--accent);border-radius:26px;padding:20px 18px 16px;margin:6px 0 10px;text-align:left}
  .scard__eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);text-align:center;margin:0 0 10px}
  .scard .gcard__row + .gcard__row{border-top:1px dashed var(--brand-tint)}
  .scard__type{text-align:center;margin-top:16px;padding-top:18px;border-top:1.5px solid var(--brand-tint)}
  .scard__photo{width:52%;max-width:200px;margin:0 auto 12px;background:#fff;border-radius:18px;padding:8px 8px 0;
    box-shadow:0 6px 18px rgba(255,90,73,.14);overflow:hidden}
  .scard__illust{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:top}
  .scard .result__intro{margin:0 0 4px}
  .scard .result__label{font-size:28px;margin:0 0 6px}
  .scard .result__one{margin:0 auto 4px}
  .scard__foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--brand-tint);text-align:center;
    font-size:12px;font-weight:700;color:var(--accent)}
  .scard__hint{text-align:center;font-size:12.5px;color:var(--text-mute);margin:6px 0 8px}
  .result > .result__body{margin:0 0 4px}

  /* ---- gap card ---- */
  .gcard{border:1.5px solid var(--accent);border-radius:var(--radius-lg);padding:18px 18px 16px;margin:6px 0 14px;text-align:left}
  .gcard__row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;font-size:15px}

  .result__intro{font-size:14px;font-weight:600;color:var(--text-mute);margin:0 0 10px}
  .result__label{font-weight:800;font-size:30px;color:var(--accent);margin:0 0 8px;letter-spacing:-.01em}
  .result__one{font-size:15px;font-weight:700;color:var(--text);margin:0 auto 16px;max-width:18em;line-height:1.5;text-wrap:balance}
  .result__body{font-size:14px;line-height:1.75;color:var(--text-mute);text-align:left;margin:0}
  .btn--save{margin-bottom:8px}
  .rcard__actions{display:flex;gap:8px;margin-top:0}
  .rcard__actions .btn{font-size:14px;padding:12px}
  /* visible tinted secondary buttons */
  .btn--tint{background:var(--brand-tint);color:var(--accent-2);border:0;font-weight:700}
  .btn--tint:hover{filter:brightness(.97)}

  /* ---- HC invite (separated) ---- */
  .invite{margin-top:16px;padding-top:22px;border-top:1px dashed var(--brand-tint);text-align:center}
  .invite__q{font-weight:800;font-size:25px;color:var(--accent);letter-spacing:-.01em;margin:0 0 10px;line-height:1.4}
  .invite__body{font-size:15px;line-height:1.7;color:var(--text-mute);margin:0 auto 16px;max-width:22em}

  .invite__brand{font-size:11.5px;line-height:1.6;color:var(--text-faint);margin:22px 0 0}
  .invite__cta{width:auto;min-width:150px;padding-left:34px;padding-right:34px;
    background:var(--accent);color:#fff;border:0}
  .invite__cta:hover{filter:brightness(1.05)}

  /* ---- gift coupon box ---- */
  .giftbox{background:var(--brand-tint);border-radius:var(--radius);padding:18px 18px 16px;
    margin:18px 0 20px;text-align:center}
  .giftbox__title{font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 4px;line-height:1.5}
  .giftbox__body{font-size:13px;color:var(--text-mute);margin:0 0 12px;line-height:1.6}
  .giftbox__body span{display:block;font-size:11.5px;margin-top:2px}
  .giftbox__code{display:flex;align-items:center;justify-content:center;gap:8px;

    font-size:12.5px;padding:7px 14px;border-radius:999px;font-family:var(--font-body)}
  .giftbox__copy:hover{filter:brightness(1.05)}
  .giftbox__hint{font-size:12.5px;line-height:1.5;color:var(--text);margin:12px 0 0}
  .giftbox__hint b{font-weight:700;color:var(--accent-2)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;
    padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}

  @media (prefers-reduced-motion:reduce){.screen{animation:none}.btn:active,.opt:hover .bubble{transform:none}}
</style>

<script>
/* ============ DATA ============ */
const AXES=["E","T","F","S"], RANK={E:0,T:1,F:2,S:3};
/* answers are shown blind in a shuffled order each round */
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const PICK_MS=350; // brief tap feedback before the next question

const QUESTIONS=[
  { depth:"가벼운 질문", q:"이상적인 주말을 그려본다면?",
    a:{E:"같이 있는 사람 기분 봐서, 하고 싶은 걸 맞춰요",T:"혼자 카페에서 책 읽어요. 연락은 저녁에 몰아서 해요",
       F:"아침에 갑자기 \"바다 갈래?\" 해요. 계획은 가면서 짜요",S:"장 보고, 밀린 집안일 하고, 저녁은 해 먹어요"} },
  { depth:"조금 더 깊이", q:"친구가 고민을 털어놓으면, 먼저 드는 생각은?",
    a:{E:"듣다가 저도 같이 울컥해요. 해결은 잘 못 해줘요",T:"그 고민이 왜 생겼는지 끝까지 물어봐요",
       F:"일단 맛있는 거 먹이고 웃게 해요. 얘기는 나중에요",S:"말은 짧게 하고, 필요한 걸 바로 해결해줘요"} },
  { depth:"조금 더 깊이", q:"누군가를 더 알고 싶어질 때는?",
    a:{E:"제가 말 안 한 기분까지 알아챌 때요",T:"새벽까지 정답 없는 얘기를 할 수 있을 때요",
       F:"별것도 아닌 걸로 배 아프게 웃을 때요",S:"아무 말 안 해도 어색하지 않을 때요"} },
  { depth:"깊은 질문", q:"좋아하는 사람이 힘들어 보이면, 어떻게 해요?",
    a:{E:"괜찮냐고 자꾸 물어봐요. 말할 때까지요",T:"왜 힘든지 같이 차분히 정리해줘요",
       F:"실없는 농담으로 일단 웃게 만들어요",S:"말은 없는데, 다음 날 필요한 걸 챙겨 와요"} }
];
const PURE={
  T:{emoji:"🌙",name:"여백형",one:"말보다 여백이 아름다운 사람에게 반하는 당신",
     body:"당신은 화려한 말이 아니라, 문득 던지는 한 마디에 오래 머무는 사람에게 마음이 움직였어요. 어쩌면 당신이 원하는 건 '나를 궁금해해주는 사람'보다, 함께 궁금해할 수 있는 사람인지도 몰라요. 같이 헤매도 편안한 사람, 그 여백 속에서 당신은 가장 당신다워지니까요."},

/* match: same axis · half: stated is one side of a blend · diff · kaleido: picked all four once */
function gapOf(stated,r){
  if(!r.ax) return "kaleido";
  if(r.ax.length===1) return r.ax[0]===stated?"match":"diff";
  return r.ax.includes(stated)?"half":"diff";
}

  kaleido:"하나로 정했지만, 실제로는<br>매번 다른 사람에게 끌렸어요"
};

/* one axis → "깊이 있는 사람" · blend → "깊이 있고 든든한 사람" */
function actualWords(r){
  if(!r.ax) return "넷 다 한 번씩";
  return r.ax.length===1 ? WORD[r.ax[0]]+" 사람" : `${WORD_AND[r.ax[0]]} ${WORD[r.ax[1]]} 사람`;
}

let state={screen:"intro",gender:null,stated:null,round:0,picks:[]};
function computeResult(picks){
  const c={E:0,T:0,F:0,S:0}; picks.forEach(p=>c[p]++);
  const s=[...AXES].sort((a,b)=>c[b]-c[a]||RANK[a]-RANK[b]);
  const top=s[0],sec=s[1];
  if(c[top]>=3) return PURE[top];
  if(c[top]===2&&c[sec]===2) return BLEND[[top,sec].sort((a,b)=>RANK[a]-RANK[b]).join("+")];
  if(c[top]===2&&c[sec]===1) return PURE[top];
  return KALEIDO;
}

/* ---- UTM capture & persistence ---- */
const UTM_KEYS=["utm_source","utm_medium","utm_campaign","utm_content","utm_term"];
function captureUTM(){
  const q=new URLSearchParams(location.search);
  const found={};
  UTM_KEYS.forEach(k=>{ if(q.has(k)) found[k]=q.get(k); });
  if(Object.keys(found).length) sessionStorage.setItem("hc_utm", JSON.stringify(found));
}
function getUTM(){
  try{ return JSON.parse(sessionStorage.getItem("hc_utm")||"{}"); }catch(e){ return {}; }
}
function withUTM(url){
  const utm=getUTM(), keys=Object.keys(utm);
  if(!keys.length) return url;
  const u=new URL(url);
  keys.forEach(k=>u.searchParams.set(k,utm[k]));
  return u.toString();
}
captureUTM();

}

/* the hook section sits below the card; a floating bar points at it until it scrolls into view */
let hookObs;
function watchHook(){
  if(hookObs) hookObs.disconnect();
  const bar=document.getElementById("hookbar"), sec=document.getElementById("invite");
  if(!bar||!sec||!("IntersectionObserver" in window)) return;
  hookObs=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ bar.classList.add("is-gone"); hookObs.disconnect(); } },{threshold:.15});
  hookObs.observe(sec);
}
function toHook(){
  track("HookBarTap");
  document.getElementById("invite")?.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ============ ACTIONS ============ */
function start(){ track("TestStart"); state={screen:"gender",gender:null,stated:null,round:0,picks:[]}; render(); }
function pickGender(g){ track("GenderPick",{gender:g}); state.gender=g; state.screen="stated"; render(); }
function pickStated(ax){ track("StatedPick",{axis:ax}); state.stated=ax; state.screen="doubt"; render(); }
function startQuestions(){ state.screen="question"; state.round=0; state.picks=[]; render(); }
function pick(ax){
  const list=app.querySelector(".achat");
  if(!list||list.classList.contains("is-locked")) return;
  track(`Q${state.round+1}`,{answer_axis:ax});
  list.classList.add("is-locked");
  const opt=list.querySelector(`.opt[data-ax="${ax}"]`);
  opt.classList.add("is-picked");
  /* no reveal here on purpose — who wrote it stays a secret until the closing hook */
  setTimeout(()=>{
    state.picks.push(ax); state.round++;
    state.screen = state.round>=QUESTIONS.length ? "result" : "question"; render();
  },PICK_MS);
}
function restart(){ state={screen:"intro",gender:null,stated:null,round:0,picks:[]}; render(); }
function ctaTap(){
  const r=computeResult(state.picks);
  track("CTAClick",{result_type:r.name});
  const go=()=>{ window.location.href=withUTM(CTA_URL); };
  /* copy the coupon on the way out — most people skip the copy button */
  if(navigator.clipboard) navigator.clipboard.writeText(COUPON_CODE)
    .then(()=>{ toast("코드를 복사해뒀어요"); setTimeout(go,700); }).catch(go);
  else go();
}
function copyCoupon(){
  track("CouponCopy");
  if(navigator.clipboard) navigator.clipboard.writeText(COUPON_CODE).then(()=>toast("코드를 복사했어요")).catch(()=>toast(COUPON_CODE));
  else toast(COUPON_CODE);
}
/* copies the test link (not the result) so friends start from the intro */
function copyLink(){

}

  온기형:"무슨 말을 했는지보다 어떤 마음이었는지를 읽어주는 사람에게 끌렸어요. 당신은 사랑을 표현이 아니라 온기로 느끼는 사람이에요.",
  여백형:"화려한 말이 아니라, 문득 던지는 한 마디에 오래 머무는 사람에게 마음이 움직였어요. 같이 헤매도 편안한 사람, 그 여백 속에서 당신은 가장 당신다워져요.",
  햇살형:"함께 웃다 보면 어느새 진심이 되는 사람에게 마음이 갔어요. 삶의 무게를 같이 덜어줄 사람 옆에서, 당신은 자주 웃게 될 거예요.",
  그늘형:"화려한 고백보다, 말없이 곁에 있어주는 사람에게 마음이 움직였어요. 늘 그 자리에 있어주는 건, 가장 어려운 애정이니까요.",
  만화경형:"순간마다 다른 결에 마음이 움직였어요. 당신에게 맞는 이상형은 유형이 아니라, 대화를 나눌수록 새로운 면이 켜지는 사람일지도 몰라요."
};
const CARD_ONE={
  햇살형:"곁에 있으면 삶이 가벼워지는\n사람에게 반하는 당신",
  만화경형:"하나의 매력에 갇히지 않는,\n입체적인 사람에게 반하는 당신"
};
function cardHeadline(r,gap){
  const said=WORD[state.stated]+" 사람";
  if(gap==="match") return {strike:"",l1:"말한 이상형 그대로,",l2:"진짜도 "+said};
  if(gap==="half"){ const other=r.ax.find(a=>a!==state.stated); return {strike:"",l1:said+"인 줄 알았는데",l2:WORD[other]+" 사람도 끌렸어요"}; }
  if(gap==="kaleido") return {strike:said,l1:"인 줄 알았는데",l2:"매번 다른 사람에게 끌렸어요"};
  return {strike:said,l1:"인 줄 알았는데",l2:"진짜는 "+actualWords(r)};
}
function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
/* korean wraps between words (keep-all); a word wider than the line breaks by character */
function wrapText(ctx,text,maxW){
  const lines=[]; let cur="";
  for(const w of text.split(" ")){
    const next=cur?cur+" "+w:w;
    if(ctx.measureText(next).width<=maxW){ cur=next; continue; }
    if(cur) lines.push(cur);
    if(ctx.measureText(w).width<=maxW){ cur=w; continue; }
    cur=""; for(const ch of w){ if(ctx.measureText(cur+ch).width>maxW){ lines.push(cur); cur=ch; } else cur+=ch; }
  }
  if(cur) lines.push(cur);
  return lines;
}
function font(weight,size){ return `${weight} ${size}px ${CARD_FONT}`; }
/* css angle gradient (deg: 0 = to top, clockwise) mapped onto canvas coordinates */
function cssGradient(ctx,deg,w,h,stops){
  const a=deg*Math.PI/180, dx=Math.sin(a), dy=-Math.cos(a), len=Math.abs(w*dx)+Math.abs(h*dy);
  const g=ctx.createLinearGradient(w/2-dx*len/2,h/2-dy*len/2,w/2+dx*len/2,h/2+dy*len/2);
  stops.forEach(([o,c])=>g.addColorStop(o,c)); return g;
}
/* spread the leftover width across the word gaps; the last line is set flush left */
function drawJustified(ctx,line,x,y,w,last){
  const words=line.split(" ");
  if(last||words.length<2){ ctx.fillText(line,x,y); return; }
  const gap=(w-words.reduce((t,wd)=>t+ctx.measureText(wd).width,0))/(words.length-1);
  if(gap>ctx.measureText(" ").width*3){ ctx.fillText(line,x,y); return; } // too loose: keep it ragged
  let cx=x; for(const wd of words){ ctx.fillText(wd,cx,y); cx+=ctx.measureText(wd).width+gap; }
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
async function buildCard(r,gap,ill){
  const cv=document.createElement("canvas"); cv.width=CARD_W; cv.height=CARD_H;
  const ctx=cv.getContext("2d"); ctx.textBaseline="top";
  ctx.fillStyle=cssGradient(ctx,274,CARD_W,CARD_H,[[0,"#FFA45C"],[.29,"#FF9A84"],[1,"#FF8FA6"]]);
  ctx.fillRect(0,0,CARD_W,CARD_H);

  if(ill){ // line art multiplied onto the gradient at 60%, fading out toward its bottom
    const im=await loadImg(ill), W=820, H=Math.round(W*im.naturalHeight/im.naturalWidth);
    const off=document.createElement("canvas"); off.width=W; off.height=H;
    const o=off.getContext("2d"); o.drawImage(im,0,0,W,H);
    o.globalCompositeOperation="destination-in";
    const m=o.createLinearGradient(0,0,0,H); m.addColorStop(0,"#000"); m.addColorStop(.62,"#000"); m.addColorStop(.86,"rgba(0,0,0,0)");
    o.fillStyle=m; o.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=.5; ctx.globalCompositeOperation="multiply"; ctx.drawImage(off,130,290); ctx.restore();
  }

  const L=80, CW=920, TOP=180, BOTTOM=CARD_H-170, cx=CARD_W/2;
  ctx.textAlign="center";
  ctx.save(); ctx.shadowColor="rgba(160,50,40,.28)"; ctx.shadowBlur=8; ctx.font=font(700,44); ctx.fillStyle="rgba(255,255,255,.92)"; ctx.fillText("나도 몰랐던 내 이상형",cx,TOP+4); ctx.restore();

  // headline: shrinks to fit when the first line is too wide
  const h=cardHeadline(r,gap); let fs=66;
  ctx.font=font(800,fs); const w1=ctx.measureText(h.strike+h.l1).width;
  if(w1>CW){ fs=Math.floor(fs*CW/w1); ctx.font=font(800,fs); }
  const lh=fs*1.35; let y=TOP+53+18;
  ctx.save(); ctx.shadowColor="rgba(160,50,40,.32)"; ctx.shadowBlur=10; ctx.shadowOffsetY=1; ctx.fillStyle="#FFFFFF";
  const sW=ctx.measureText(h.strike).width, lW=ctx.measureText(h.l1).width, x0=cx-(sW+lW)/2, ty=y+(lh-fs)/2;
  ctx.textAlign="left";
  if(h.strike){ ctx.globalAlpha=.7; ctx.fillText(h.strike,x0,ty); ctx.fillRect(x0,ty+fs*.52,sW,4); ctx.globalAlpha=1; }
  ctx.fillText(h.l1,x0+sW,ty);
  ctx.textAlign="center"; y+=lh;
  for(const line of wrapText(ctx,h.l2,CW)){ ctx.fillText(line,cx,y+(lh-fs)/2); y+=lh; }
  ctx.restore();

  // bottom-up: brand line, then the frosted box above it
  const footH=42, footY=BOTTOM-footH;
  ctx.font=font(500,35); ctx.fillStyle="rgba(255,255,255,.95)"; ctx.fillText("블라인드 연프, 하트커넥트",cx,footY+3);

  const PX=48, IW=CW-PX*2;
  ctx.font=font(700,44); const oneLines=(CARD_ONE[r.name]||r.one).split("\n").flatMap(t=>wrapText(ctx,t,IW-20));
  ctx.font=font(400,38); const bodyLines=wrapText(ctx,CARD_BODY[r.name]||r.body,IW);
  const leadH=40, nameH=4+101+10, oneH=10+oneLines.length*61.6+10, bodyH=18+bodyLines.length*60.8;
  const boxH=46+leadH+nameH+oneH+bodyH+44, boxY=footY-26-boxH;
  ctx.fillStyle="rgba(255,255,255,.6)"; roundRect(ctx,L,boxY,CW,boxH,44); ctx.fill();

  let by=boxY+46;
  ctx.font=font(600,33); ctx.fillStyle="#6B4A44"; ctx.fillText("그래서 진짜 이상형은",cx,by+3); by+=leadH+4;
  ctx.font=font(800,84); ctx.fillStyle="#FF4B24"; ctx.fillText(`${r.emoji} ${r.name}`,cx,by+8); by+=101+10;
  ctx.font=font(700,44); ctx.fillStyle="#1A1A1C"; by+=10;
  for(const line of oneLines){ ctx.fillText(line,cx,by+8); by+=61.6; }
  by+=10+18;
  ctx.font=font(400,38); ctx.fillStyle="#4A3A37"; ctx.textAlign="left";
  bodyLines.forEach((line,k)=>{ drawJustified(ctx,line,L+PX,by+11,IW,k===bodyLines.length-1); by+=60.8; });

  const blob=await new Promise(ok=>cv.toBlob(ok,"image/png"));
  return {blob,url:URL.createObjectURL(blob)};
}
async function saveCard(){
  const c=state.card; if(!c) return;
  track("SaveImage",{result_type:computeResult(state.picks).name});
  const file=new File([c.blob],"나도-몰랐던-내-이상형.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=c.url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  toast("저장이 안 되면 이미지를 길게 눌러 저장해주세요");
}
function copyText(t,msg){ if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>toast(t)); else toast(t); }
let toastT;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}

render();
</script>
</body>
